[project]
name = "mecky"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "beautifulsoup4>=4.12", "pypdf>=5", "fonttools>=4.0", "python-dotenv>=1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mecky"]

[tool.setuptools.package-data]
mecky = ["*.yaml"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
