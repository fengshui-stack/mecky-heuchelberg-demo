services:
  - type: web
    name: mecky-heuchelberg-demo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mecky.serve
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MECKY_DB
        value: /tmp/mecky.db
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: MECKY_ALLOWED_ORIGINS
        value: https://mecky-kundentest.ben-fenger.chatgpt.site
      - key: ADMIN_SECRET
        sync: false
